<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pravin News - Poster Studio</title>
<link href="https://fonts.googleapis.com/css2?family=Anek+Devanagari:wght@700;800&family=Khand:wght@600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; }
body { font-family: 'Anek Devanagari', sans-serif; background:#0f172a; color:#fff; margin:0; padding:14px; min-height:100vh; }
.main { display:flex; gap:30px; justify-content:center; align-items:flex-start; max-width:1300px; margin:0 auto; }
.preview { flex-shrink:0; position:sticky; top:14px; }
#cv { display:block; background:#888 repeating-conic-gradient(#aaa 0% 25%, #777 0% 50%) 50% / 28px 28px; box-shadow:0 18px 45px rgba(0,0,0,.8); max-width:100%; height:auto; }
.editor { background:#1e293b; padding:16px; border-radius:12px; width:100%; max-width:500px; border:1px solid #334155; }
.box { background:#0f172a; padding:10px 12px; border-radius:8px; margin-bottom:12px; }
label { font-size:13px; color:#FFD600; display:block; margin-bottom:6px; font-weight:700; }
.sub { color:#94a3b8; font-size:11px; font-weight:400; margin-bottom:2px; }
input[type=text], input[type=date], textarea, input[type=file] { width:100%; margin-bottom:8px; padding:10px; border-radius:6px; border:1px solid #334155; background:#1e293b; color:#fff; font-size:14px; font-family:inherit; }
input[type=range] { width:100%; margin:0 0 6px; }
select { width:100%; padding:10px; border-radius:6px; border:1px solid #334155; background:#1e293b; color:#fff; font-size:14px; font-family:inherit; margin-bottom:8px; }
.row { display:flex; gap:8px; } .row > div { flex:1; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.opt { padding:9px 6px; border-radius:8px; border:2px solid #334155; background:#1e293b; color:#e2e8f0; font-weight:700; font-size:13px; cursor:pointer; text-align:center; font-family:inherit; }
.opt.on { border-color:#FFD600; background:#3a3210; color:#FFD600; }
button.act { width:100%; padding:12px; border-radius:6px; border:none; font-weight:700; cursor:pointer; font-size:15px; margin-bottom:8px; font-family:inherit; }
.blue { background:#3b82f6; color:#fff; } .white { background:#fff; color:#000; } .gray { background:#334155; color:#fff; font-size:12px; padding:8px; }
.chk { display:flex; align-items:center; gap:8px; font-size:13px; margin-bottom:6px; color:#e2e8f0; }
.chk input { width:auto; margin:0; }
.hide { display:none; }
@media (max-width:860px){ .main{flex-direction:column; align-items:center; gap:10px;} .preview{position:static;} .editor{max-width:96vw;} }
</style>
</head>
<body>
<div class="main">
  <div class="preview"><canvas id="cv" width="1080" height="1350"></canvas></div>

  <div class="editor">
    <div class="box">
      <label>1. डिज़ाइन (टेम्पलेट):</label>
      <div class="grid" id="tplGrid"></div>
    </div>
    <div class="box">
      <label>2. साइज़ / फ़ॉर्मेट:</label>
      <div class="grid" id="fmtGrid"></div>
    </div>
    <div class="box hide" id="styleBox">
      <label>रंग और स्टाइल:</label>
      <div id="colorCtl" class="hide"><div class="sub">रंग-संयोजन</div>
        <select id="colorSel" onchange="S.color=this.value; render()"></select></div>
      <div id="ovCtl" class="hide"><div class="sub">ओवरले कार्ड की ऊँचाई (छोटा = वीडियो ज़्यादा दिखेगा)</div>
        <input type="range" id="ovH" min="8" max="34" value="16" oninput="render()"></div>
    </div>
    <div class="box">
      <label>3. मुख्य हेडलाइन:</label>
      <input type="text" id="headInp" placeholder="हेडलाइन लिखें... (चाहें तो *शब्द* तारे में लिखकर खुद रंग चुनें)" oninput="render()">
      <label id="bodyLbl">नीचे की खबर:</label>
      <textarea id="bodyInp" rows="3" placeholder="नीचे का समाचार विवरण..." oninput="render()"></textarea>
      <label id="tagLbl">टैग / बड़ा शब्द (खाली छोड़ें तो अपने आप):</label>
      <input type="text" id="tagInp" placeholder="जैसे: क्राइम न्यूज़, बधाई, खेल समाचार" oninput="render()">
    </div>
    <div class="box">
      <label>4. फ़ोटो और अलाइनमेंट:</label>
      <input type="file" id="imageLoader" accept="image/*" onchange="loadPhoto()">
      <div class="sub" id="photoHint" style="margin-bottom:8px">फ़ोटो न डालें तो फ़ोटो वाला हिस्सा पारदर्शी रहेगा (ओवरले / जैकेट PNG)। टैग, लोगो और टेक्स्ट बने रहेंगे।</div>
      <button class="act gray" style="margin-bottom:8px" onclick="removePhoto()">फ़ोटो हटाएँ (पारदर्शी करें)</button>
      <div class="row">
        <div><div class="sub">ज़ूम</div><input type="range" id="zoom" min="0.5" max="3" step="0.01" value="1" oninput="render()"></div>
        <div><div class="sub">दाएँ/बाएँ</div><input type="range" id="offX" min="-100" max="100" value="0" oninput="render()"></div>
        <div><div class="sub">ऊपर/नीचे</div><input type="range" id="offY" min="-100" max="100" value="0" oninput="render()"></div>
      </div>
    </div>
    <div class="box">
      <label>5. खबर की तारीख:</label>
      <input type="date" id="dateInp" oninput="render()">
      <label>लोगो (PNG, एक बार डालिए - याद रहेगा):</label>
      <input type="file" id="logoLoader" accept="image/png,image/*" onchange="loadLogo()">
      <button class="act gray" onclick="clearLogo()">लोगो हटाएँ</button>
    </div>
    <button class="act blue" onclick="reshuffle()">रंग बदलें ↻</button>
    <button class="act white" id="saveBtn" onclick="download()">पोस्टर डाउनलोड करें (PNG)</button>
  </div>
</div>

<script>

let photo = null, logo = null, frame = null;

function el(id){ return document.getElementById(id); }

/* ---------------- संज्ञा पहचान (नाम रंगने के लिए) ---------------- */

const STOP = new Set((`
 का की के को में पर से ने तक लिए लिये द्वारा साथ बाद पहले बीच अंदर बाहर ऊपर नीचे दौरान अनुसार बारे बाबत तरफ ओर कारण

 छह सात आठ नौ दस इस उस यह वह ये वे जो जिस जिसे जिन जिनके कि क्योंकि लेकिन परंतु और एवं तथा या अपने अपनी अपना उनके
 उनकी उनका उन्हें उसे इसे इसके इसकी इसका उसके उसकी उसका मेरे मेरी मेरा हम आप तुम उन्होंने उसने इन्होंने हमारे आपके
 जैसे जैसा जैसी ऐसे ऐसा ऐसी कैसे कौन क्या किस किसका किसकी क्यों कितना कितने आदि सहित सिर्फ केवल बस ताकि जिससे जिसमें
 है हैं था थे थी हो होता होती होते होगा होगी होंगे हुआ हुई हुए हुईं गया गई गए गये गयी रहा रही रहे किया किए दिया दी दिए
 दिये लिया ली कहा कही कहे बताया बताई बताए बताते सुनाई सुनाया सुनाए पहुंचे पहुंची पहुंचा पहुंचना निकला निकली निकले मिला
 मिली मिले लगी लगा लगे आया आई आए आये आने जाने करने देने लेने होने रखने बनाने बनाया बनी बने बना करें करे करेगा करेंगे
 करना करता करती करते देना देता देती देते लेना लेता लेती लेते जाना जाता जाती जाते आना आता आती आते रहना रखा रखी रखे
 उठा उठाई उठे दिखा दिखी दिखे दिखाई दिखाया चला चली चले जुटी जुटे जुटा मचा मची मचे टला टली टले घुसी घुसा घुसे पड़ा पड़ी
 पड़े खुला खुली खुले सौंपी सौंपा चढ़ा रोका रोकी लगाई लगाया उठाया जताई जताया भेजा भेजी भेजे पाया पाई पाए सकता सकती सकते
 सोमवार मंगलवार बुधवार गुरुवार शुक्रवार शनिवार रविवार सुबह दोपहर शाम रात बीती बीते आगामी वर्ष साल महीने दिन घंटे मिनट
 लाख करोड़ हजार सैकड़ा किलो किलोग्राम प्रतिशत रुपये रुपया
 बड़ा बड़ी बड़े छोटा छोटी छोटे नया नई नए पुराना पुरानी पुराने अधिक ज्यादा कम पूरा पूरी पूरे अचानक तुरंत तत्काल करीब लगभग
 सुरक्षित गंभीर भारी भव्य बेकाबू जोरदार शानदार प्रमुख मुख्य विशेष अन्य दूसरा दूसरी दूसरे पहला पहली आवश्यक सकुशल स्थानीय
 सरकारी राष्ट्रीय क्षेत्रीय संबंधित उत्कृष्ट उल्लेखनीय सैकड़ों हजारों लाखों कुल सारे सारी सारा हर प्रत्येक सामान्य
 जीता जीती जीते परखी परखा परखे कराया कराई कराए करवाया सौंपे आधे आधा आधी तैनात उड़े उड़ा उड़ी
`).split(/\s+/).filter(Boolean));
const HONOR = new Set(['श्री','श्रीमती','सुश्री','डॉ','डॉ.','डा.','कुमारी','पंडित','मौलाना','सूबेदार']);
const ROLE = new Set(['सीएम','पीएम','मुख्यमंत्री','प्रधानमंत्री','मंत्री','विधायक','सांसद','महापौर','आयुक्त','जिलाधिकारी','डीएम','एसएसपी',
 'एसपी','एसीपी','डीसीपी','एडीसीपी','कोच','अध्यक्ष','उपाध्यक्ष','सचिव','प्रबंधक','इंस्पेक्टर','दरोगा','सिपाही','चालक','युवक','युवती',
 'पहलवान','प्रभारी','निरीक्षक','अधिकारी','चेयरमैन','निदेशक','कलेक्टर','न्यायाधीश','जज']);
const PLACE_TYPE = new Set(['थाना','थाने','गांव','गाँव','जिला','जनपद','तहसील','ब्लॉक','मंदिर','घाट','स्टेडियम','कॉलेज','स्कूल','अस्पताल',
 'बैंक','पुल','चौराहा','चौकी','कस्बा','शहर','मोहल्ला','नगर','बाजार','हाईवे','मार्ग','रोड','स्टेशन','शाखा','विश्वविद्यालय','सभागार',
 'संकुल','अदालत','कोर्ट','मस्जिद','चर्च','गुरुद्वारा','पार्क','आश्रम','धाम','मंडल','कार्यालय']);
const KNOWN_PLACES = (`
 वाराणसी काशी बनारस लखनऊ दिल्ली मुंबई गोरखपुर प्रयागराज इलाहाबाद अयोध्या जौनपुर मऊ बलिया गाजीपुर चंदौली मिर्जापुर भदोही सोनभद्र
 आजमगढ़ आज़मगढ़ बस्ती कानपुर आगरा मेरठ नोएडा अहमदाबाद पटना बिहार झारखंड बंगाल गुजरात भारत सारनाथ पैगंबरपुर सिगरा लोहता
 चौबेपुर शिवपुर जंसा बड़ागांव हरहुआ पिंडरा रामनगर राजातालाब सेवापुरी चोलापुर कैंट लंका अस्सी मैदागिन गोदौलिया दशाश्वमेध
 राजघाट चौकाघाट पांडेयपुर भेलूपुर लहरतारा मंडुवाडीह कचहरी रोहनिया जमालपुर बाबतपुर छितौनी परमानंदपुर औड़िहार जूनागढ़ हालोल
 पंचमहल घोसी बनियापार करधना बरकी पूराघाट चांदमारी क्राइस्ट मिर्जामुराद गाजियाबाद उत्तराखंड पंजाब राजस्थान महाराष्ट्र
 काशी-विश्वनाथ विश्वनाथ गंगा वरुणा एयर-शो
`).split(/\s+/).filter(Boolean);
const KNOWN_SET = new Set(KNOWN_PLACES.map(x => x.replace('-', ' ')));
const WEAK_SKIP = new Set((`
 निर्देश सुरक्षा प्रबंधन मांग तैयारी तैयारियां आशंका स्वागत उत्साह जांच कार्रवाई व्यवस्था समस्या सूचना जानकारी मामला घटना प्रयास
 उपलब्धि सम्मान बधाई शुभकामनाएं यातायात अपील संकल्प शपथ दौरे दौरा आगमन भ्रमण निरीक्षण ट्रायल बात बातें मौका स्थिति माहौल
`).split(/\s+/).filter(Boolean));
const VERB_END = /(ीं|ेगा|ेगी|ेंगे|ोंगे|ोगा|ोगी|ाया|ाए|ाकर|कर|रहा|रहे|रही|वाले|वाली|वाला)$/;

function cleanWord(w){
  const P = /^[\s"'“”‘’()\[\]{}.,;:!?।|\-–—*]+|[\s"'“”‘’()\[\]{}.,;:!?।|\-–—*]+$/g;
  return w.replace(P, '');
}
function isStop(c){ return !c || c.length < 2 || STOP.has(c) || /^[\d०-९][\d०-९.,:\/\-]*$/.test(c); }

function findNouns(words){
  const n = words.length, used = new Array(n).fill(false), ents = [];
  const free = (a,b)=>{ for(let k=a;k<=b;k++) if(used[k]) return false; return true; };
  const take = (a,b,score)=>{ if(!free(a,b)) return false; for(let k=a;k<=b;k++) used[k]=true; ents.push({a,b,score}); return true; };
  const nounish = k => k>=0 && k<n && !isStop(words[k]) && !HONOR.has(words[k]) && !ROLE.has(words[k]) && !PLACE_TYPE.has(words[k]) && !WEAK_SKIP.has(words[k]);
  for(let i=0;i<n;i++){ if(HONOR.has(words[i])||ROLE.has(words[i])){ let j=i+1; while(j<n && j<=i+2 && nounish(j)) j++; if(j>i+1) take(i+1,j-1,5); } }
  for(let i=0;i<n;i++){ if(i+1<n && KNOWN_SET.has(words[i]+' '+words[i+1])) take(i,i+1,4); else if(KNOWN_SET.has(words[i])) take(i,i,4); }
  for(let i=0;i<n;i++){
    if(!PLACE_TYPE.has(words[i])) continue;
    const prev = ents.find(e=>e.b===i-1 && e.score>=4);
    if(prev && !used[i]){ prev.b=i; used[i]=true; }
    else if(nounish(i-1) && take(i-1,i,4)){}
    else if(nounish(i+1) && take(i,i+1,4)){}
    else take(i,i,2);
  }
  for(let i=0;i<n;i++) if(/[A-Za-z]{2,}/.test(words[i]) && !isStop(words[i])) take(i,i,4);
  for(let i=0;i<n;i++) if(ROLE.has(words[i])) take(i,i,3);
  for(let i=0;i<n;i++){ const w=words[i]; if(!isStop(w)&&!HONOR.has(w)&&!WEAK_SKIP.has(w)&&w.length>=3&&!VERB_END.test(w)) take(i,i,1); }
  return ents;
}
function rng(seed){ let a=seed>>>0; return function(){ a=(a+0x6D2B79F5)|0; let t=Math.imul(a^(a>>>15),1|a); t=(t+Math.imul(t^(t>>>7),61|t))^t; return ((t^(t>>>14))>>>0)/4294967296; }; }
function chooseNouns(ents, max, r, lens){
  const by={}; ents.forEach(e=>{ (by[e.score]=by[e.score]||[]).push(e); });
  const order=[];
  [5,4,3,2,1].forEach(sc=>{
    let arr=(by[sc]||[]).slice();
    const L=e=>{ let l=0; for(let k=e.a;k<=e.b;k++) l+=lens[k]||0; return l; };
    if(sc===1){ arr.sort((x,y)=>L(y)-L(x)); arr=arr.slice(0,6); }
    for(let i=arr.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    order.push(...arr);
  });
  const picked=[];
  for(const e of order){ if(picked.length>=max) break; if(picked.every(p=>e.a>p.b+1||e.b<p.a-1)) picked.push(e); }
  return picked;
}
// पाठ -> [{t:शब्द, hi:true/false}]   (*तारे* में लिखे शब्द हों तो सिर्फ़ वही रंगेंगे)
function colorWords(text, max, seedBase){
  text = (text||'').trim();
  if(!text) return [];
  if(/\*[^*]+\*/.test(text)){
    const out=[];
    text.split(/(\*[^*]+\*)/).forEach(seg=>{
      if(!seg) return;
      const hi=/^\*[^*]+\*$/.test(seg);
      (hi?seg.slice(1,-1):seg).split(/\s+/).filter(Boolean).forEach(w=>out.push({t:w,hi}));
    });
    return out;
  }
  const words=text.split(/\s+/).filter(Boolean);
  const clean=words.map(cleanWord);
  const r=rng(S.seed*seedBase+13);
  const picked=chooseNouns(findNouns(clean), words.length<=4?1:max, r, clean.map(w=>w.length));
  const hi=new Set(); picked.forEach(e=>{ for(let k=e.a;k<=e.b;k++) hi.add(k); });
  return words.map((t,i)=>({t,hi:hi.has(i)}));
}

/* ---------------- कैनवास के हेल्पर ---------------- */
function rrect(x,y,w,h,r){
  const rr=Math.min(r,w/2,h/2);
  ctx.beginPath(); ctx.moveTo(x+rr,y); ctx.arcTo(x+w,y,x+w,y+h,rr); ctx.arcTo(x+w,y+h,x,y+h,rr);
  ctx.arcTo(x,y+h,x,y,rr); ctx.arcTo(x,y,x+w,y,rr); ctx.closePath();
}
function poly(pts){ ctx.beginPath(); pts.forEach((p,i)=> i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1])); ctx.closePath(); }
function vgrad(y0,y1,stops){ const g=ctx.createLinearGradient(0,y0,0,y1); stops.forEach(s=>g.addColorStop(s[0],s[1])); return g; }

// फ़ोटो को किसी भी आकार (path) में भरता है। हल्का धुंधला बैकग्राउंड भी देता है।
function paintPhoto(x,y,w,h,pathFn,opts){
  opts=opts||{};
  if(!photo){            // फ़ोटो नहीं है: उस हिस्से को पूरी तरह पारदर्शी (खाली) कर दो
    ctx.save(); ctx.globalCompositeOperation='destination-out'; ctx.fillStyle='#000';
    if(pathFn){ pathFn(); ctx.fill(); } else ctx.fillRect(x,y,w,h);
    ctx.restore(); return;
  }
  ctx.save();
  if(pathFn){ pathFn(); ctx.clip(); } else { ctx.beginPath(); ctx.rect(x,y,w,h); ctx.clip(); }
  const pw=photo.width, ph=photo.height;
  // 1) धुंधला बैकग्राउंड
  const cs=Math.max(w/pw,h/ph), bw=pw*cs, bh=ph*cs;
  const k=24, small=document.createElement('canvas'); small.width=Math.max(8,Math.round(w/k)); small.height=Math.max(8,Math.round(h/k));
  const sc=small.getContext('2d'); sc.imageSmoothingQuality='high';
  sc.drawImage(photo,(small.width-bw/k)/2,(small.height-bh/k)/2,bw/k,bh/k);
  const mid=document.createElement('canvas'); mid.width=Math.max(16,Math.round(w/6)); mid.height=Math.max(16,Math.round(h/6));
  const mc=mid.getContext('2d'); mc.imageSmoothingQuality='high'; mc.drawImage(small,0,0,mid.width,mid.height);
  ctx.imageSmoothingQuality='high'; ctx.drawImage(mid,x,y,w,h);
  ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.fillRect(x,y,w,h);
  // 2) असली फ़ोटो
  const base = opts.base==='width' ? w/pw : cs;
  const z=parseFloat(el('zoom').value)*base, iw=pw*z, ih=ph*z;
  const cx=x+w/2+parseFloat(el('offX').value)/100*w;
  const cy=(opts.cy!==undefined? opts.cy : y+h/2)+parseFloat(el('offY').value)/100*h;
  if(opts.filter && 'filter' in ctx) ctx.filter=opts.filter;
  ctx.drawImage(photo,cx-iw/2,cy-ih/2,iw,ih);
  ctx.filter='none';
  ctx.restore();
}

/* टेक्स्ट: लाइनों में बाँटना, साइज़ ऑटो-फिट, रंगीन शब्द */
function metrics(font){
  ctx.font=font; const m=ctx.measureText('अgहQ');
  const asc=m.fontBoundingBoxAscent||parseFloat(font.match(/(\d+(\.\d+)?)px/)[1])*0.9;
  const desc=m.fontBoundingBoxDescent||parseFloat(font.match(/(\d+(\.\d+)?)px/)[1])*0.3;
  return {asc,desc};
}
function wrapWords(words,maxW){
  const sp=ctx.measureText(' ').width, lines=[]; let cur={words:[],w:0};
  words.forEach(wd=>{
    const ww=ctx.measureText(wd.t).width;
    if(cur.words.length && cur.w+sp+ww>maxW){ lines.push(cur); cur={words:[],w:0}; }
    cur.w += (cur.words.length?sp:0)+ww; cur.words.push({t:wd.t,hi:wd.hi,w:ww});
  });
  if(cur.words.length) lines.push(cur);
  return {lines,sp};
}
function layoutText(words,family,weight,maxW,maxH,maxS,minS,lh){
  let size=Math.round(maxS), font, m, box, h, res;
  const attempt=sz=>{
    font=weight+' '+sz+'px '+family; ctx.font=font; m=metrics(font); res=wrapWords(words,maxW);
    box=sz*lh; const n=res.lines.length;
    h=(n-1)*box+Math.max(box,m.asc+m.desc);          // पूरा टेक्स्ट-ब्लॉक (ऊपर की मात्राओं समेत)
    return res.lines.every(l=>l.w<=maxW+1) && h<=maxH;
  };
  for(;size>=minS;size-=2){ if(attempt(size)) break; }
  if(size<minS){ size=minS; attempt(size); }
  return Object.assign({size,font,lh,h,box},res,m);
}
// L: layoutText का नतीजा.  align: left | center | right
function drawText(L,x,y,align,base,hi,o){
  o=o||{}; ctx.font=L.font; ctx.textBaseline='alphabetic'; ctx.textAlign='left'; ctx.lineJoin='round';
  const first=Math.max(0,(L.box-(L.asc+L.desc))/2);     // y से ऊपर कुछ नहीं निकलेगा
  L.lines.forEach((ln,i)=>{
    const by=y+first+L.asc+i*L.box;
    let sx = align==='center'? x-ln.w/2 : align==='right'? x-ln.w : x;
    ln.words.forEach(wd=>{
      if(o.shadow){ ctx.shadowColor=o.shadow; ctx.shadowBlur=o.shadowBlur||12; ctx.shadowOffsetY=o.shadowY||4; }
      if(o.stroke){ ctx.strokeStyle=o.stroke; ctx.lineWidth=o.sw||L.size*0.1; ctx.strokeText(wd.t,sx,by); }
      ctx.fillStyle=wd.hi?hi:base; ctx.fillText(wd.t,sx,by);
      ctx.shadowColor='transparent'; ctx.shadowBlur=0; ctx.shadowOffsetY=0;
      sx+=wd.w+L.sp;
    });
  });
}

/* तारीख / ब्रांड */
function dateText(){
  const v=el('dateInp').value; if(!v) return '';
  const p=v.split('-'); return parseInt(p[2],10)+' '+MONTHS[parseInt(p[1],10)-1]+' '+p[0];
}
function drawPill(text,x,y,h,align,bg,fg,border,font){
  ctx.font=font||('800 '+Math.round(h*0.5)+'px '+ANEK);
  const tw=ctx.measureText(text).width, w=tw+h*0.8;
  const px= align==='right'? x-w : align==='center'? x-w/2 : x;
  rrect(px,y,w,h,h*0.22); ctx.fillStyle=bg; ctx.fill();
  if(border){ ctx.lineWidth=Math.max(2,h*0.07); ctx.strokeStyle=border; ctx.stroke(); }
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(text,px+w/2,y+h/2+h*0.03);
  return {x:px,w};
}
function drawBrand(x,y,h,align){
  if(logo){
    const lw=logo.width*h/logo.height, w=lw+h*0.3;
    const px= align==='right'? x-w : align==='center'? x-w/2 : x;
    rrect(px,y,w,h+h*0.0,h*0.18); ctx.fillStyle='#fff'; ctx.fill();
    ctx.drawImage(logo,px+h*0.15,y+h*0.0,lw,h);
    return {x:px,w};
  }
  return drawPill(HANDLE,x,y,h,align,'#ffffff','#111827','#d10000');
}
function drawDate(x,y,h,align,bg,fg,accent){
  const t=dateText(); if(!t) return;
  ctx.font='800 '+Math.round(h*0.52)+'px '+ANEK;
  const w=ctx.measureText(t).width+h*0.75, px= align==='right'? x-w : align==='center'? x-w/2 : x;
  ctx.fillStyle=bg; ctx.fillRect(px,y,w,h); ctx.fillStyle=accent; ctx.fillRect(px,y,Math.max(4,h*0.1),h);
  ctx.fillStyle=fg; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(t,px+w/2+h*0.04,y+h/2+h*0.03);
}
function footerText(x,y,align,color,size,text){
  ctx.font='800 '+size+'px '+ANEK; ctx.fillStyle=color; ctx.textAlign=align; ctx.textBaseline='middle'; ctx.fillText(text,x,y);
}


/* सोशल आइकन (खुद बनाए हुए) और "FOLLOW & SHARE" पंक्ति */
function iconYT(x,y,w,h){ rrect(x,y,w,h,h*0.28); ctx.fillStyle='#FF0000'; ctx.fill(); ctx.fillStyle='#fff'; poly([[x+w*0.4,y+h*0.27],[x+w*0.4,y+h*0.73],[x+w*0.69,y+h*0.5]]); ctx.fill(); }
function iconIG(x,y,s){
  const g=ctx.createLinearGradient(x,y+s,x+s,y); g.addColorStop(0,'#FEDA75'); g.addColorStop(0.35,'#FA7E1E'); g.addColorStop(0.62,'#D62976'); g.addColorStop(1,'#4F5BD5');
  rrect(x,y,s,s,s*0.28); ctx.fillStyle=g; ctx.fill();
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.075; rrect(x+s*0.2,y+s*0.2,s*0.6,s*0.6,s*0.18); ctx.stroke();
  ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s*0.15,0,7); ctx.stroke(); ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x+s*0.69,y+s*0.31,s*0.045,0,7); ctx.fill();
}
function iconFB(x,y,s){
  ctx.fillStyle='#1877F2'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2,0,7); ctx.fill();
  ctx.fillStyle='#fff'; ctx.font='800 '+Math.round(s*0.82)+'px '+ANEK; ctx.textAlign='center'; ctx.textBaseline='alphabetic'; ctx.fillText('f',x+s*0.56,y+s*0.88);
}
function iconX(x,y,s){
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.arc(x+s/2,y+s/2,s/2,0,7); ctx.fill(); ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=s*0.045; ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=s*0.09; ctx.lineCap='round'; ctx.beginPath();
  ctx.moveTo(x+s*0.3,y+s*0.28); ctx.lineTo(x+s*0.7,y+s*0.72); ctx.moveTo(x+s*0.7,y+s*0.28); ctx.lineTo(x+s*0.3,y+s*0.72); ctx.stroke(); ctx.lineCap='butt';
}
// xr: दाएँ किनारा, yc: बीच की लाइन, h: आइकन का साइज़, maxW: कितनी चौड़ाई मिल सकती है
function followRow(xr,yc,h,handleCol,labelCol,maxW){
  const hs=Math.round(h*0.66); ctx.font='800 '+hs+'px '+ANEK; const hw=ctx.measureText(HANDLE).width;
  const gap=h*0.26, ws=[h*1.3,h,h,h], iw=ws.reduce((a,b)=>a+b,0)+gap*3;
  ctx.textBaseline='middle'; ctx.textAlign='right'; ctx.fillStyle=handleCol; ctx.fillText(HANDLE,xr,yc+h*0.04);
  let x=xr-hw-gap*1.8-iw; const top=yc-h/2;
  iconYT(x,top,ws[0],h); x+=ws[0]+gap; iconIG(x,top,h); x+=h+gap; iconFB(x,top,h); x+=h+gap; iconX(x,top,h);
  const lab='FOLLOW & SHARE', ls=Math.round(h*0.42); ctx.font='800 '+ls+'px '+ANEK; const lw=ctx.measureText(lab).width;
  const leftX=xr-hw-gap*1.8-iw;
  if(leftX-gap*1.6-lw >= xr-maxW){ ctx.textAlign='right'; ctx.fillStyle=labelCol; ctx.textBaseline='middle'; ctx.fillText(lab,leftX-gap*1.6,yc+h*0.04); }
  return leftX;
}
// बाएँ तारीख, दाएँ फ़ॉलो/शेयर
function footerRow(x0,xr,yc,fh,dateCol,handleCol,labelCol){
  const ds=Math.round(fh*0.5), dt=dateText();
  if(dt) footerText(x0,yc,'left',dateCol,ds,dt);
  ctx.font='800 '+ds+'px '+ANEK; const dw=dt?ctx.measureText(dt).width:0;
  followRow(xr,yc,Math.round(fh*0.62),handleCol,labelCol,(xr-x0)-dw-fh*0.8);
}

/* ---------------- टेम्पलेट ---------------- */
const TPL = {};

/* रंग-संयोजन (ड्रॉप-डाउन से चुनें):  पृष्ठभूमि  +  उभार का रंग */
const PAL = {
  bluey:{ name:'नीला + पीला (पहले वाला)',        bg0:'#0b1b3a', bg1:'#0d2a5e', accent:'#FFD600', hi:'#FFD600', base:'#ffffff', tagFg:'#111111', bodyCol:'#cbd5e1', bodyHi:'#fbbf24' },
  c1:   { name:'गहरा हरा-नीला + आसमानी (01393C / 00FFFF)', bg0:'#01393c', bg1:'#01191b', accent:'#00ffff', hi:'#00ffff', base:'#ffffff', tagFg:'#01393c', bodyCol:'#cfeaeb', bodyHi:'#00ffff' },
  c2:   { name:'गहरा भूरा + सुनहरा (290C00 / FFBA00)',     bg0:'#290c00', bg1:'#100400', accent:'#ffba00', hi:'#ffba00', base:'#ffffff', tagFg:'#290c00', bodyCol:'#f1dcc2', bodyHi:'#ffba00' },
  c3:   { name:'गहरा हरा + पीला (17484C / FFEC43)',        bg0:'#17484c', bg1:'#0a2528', accent:'#ffec43', hi:'#ffec43', base:'#ffffff', tagFg:'#17484c', bodyCol:'#d3e8e9', bodyHi:'#ffec43' },
  c4:   { name:'स्लेट-नीला + सफ़ेद (23263E / FEFEFC)',      bg0:'#23263e', bg1:'#10121f', accent:'#fefefc', hi:'#fefefc', base:'#aeb4d1', tagFg:'#23263e', bodyCol:'#aeb4d1', bodyHi:'#fefefc' }
};
function pal(){ return PAL[S.color]||PAL.bluey; }

// हेडलाइन + खबर को एक डिब्बे में बैठाता है।
// खबर न हो -> हेडलाइन पूरा डिब्बा भर देती है।  खबर हो -> जितनी लंबी खबर, उतनी हेडलाइन छोटी।
function drawHeadBody(head,body,ax,ay,aw,ah,o){
  o=o||{}; const align=o.align||'left', gap=o.gap||ah*0.04, has=body.length>0;
  let hh=ah;
  if(has){
    const chars=body.map(w=>w.t).join(' ').length;
    const frac=Math.max(0.34,Math.min(0.62,0.62-(Math.min(chars,420)/420)*0.28));
    hh=ah*frac;
  }
  const hl=layoutText(head,KHAND,'700',aw,hh,o.headMax||ah,30,o.headLH||1.08);
  let bl=null;
  if(has){ bl=layoutText(body,ANEK,'700',aw,Math.max(ah-hl.h-gap,10),Math.min(o.bodyMax||60,hl.size*0.6),18,o.bodyLH||1.3); }
  const total=hl.h+(has?gap+bl.h:0);
  let y=ay+Math.max(0,(ah-total)/2);
  const x= align==='center'? ax+aw/2 : ax;
  drawText(hl,x,y,align,o.headCol||'#fff',o.headHi||'#FFD600',o.headFx);
  if(has){
    y+=hl.h+gap;
    if(o.divider){ ctx.fillStyle=o.divider; const dw=o.divW||90, dx= align==='center'? ax+aw/2-dw/2 : ax; ctx.fillRect(dx,y-gap*0.5-(o.divH||6)/2,dw,o.divH||6); }
    drawText(bl,x,y,align,o.bodyCol||'#ddd',o.bodyHi||'#FFD600');
  }
  return {headH:hl.h};
}

/* 0) क्लासिक - आपका पुराना डिज़ाइन (सिर्फ़ 4:5) */
TPL.classic = { name:'क्लासिक (आपका फ्रेम)', fmts:['post45'], tag:null, body:true, hi:'#FFD600', bodyLabel:'नीचे की खबर:',

/* 2) क्लीन कार्ड - सफ़ेद/नीला/सुनहरा */
TPL.clean = { name:'क्लीन कार्ड', tag:'ताज़ा खबर', body:true, hi:'#C27C00', bodyLabel:'नीचे की खबर:',
 draw(g,head,body,tag){

/* दो-भाग कार्ड - आधी फ़ोटो, आधा टेक्स्ट */
TPL.split = { name:'दो-भाग कार्ड', body:true, color:true, bodyLabel:'नीचे की खबर:',
 draw(g,head,body,tag){

  } else {
    const sy=H*(g.story?0.5:0.52); slant=H*0.03;
    paintPhoto(0,0,W,sy+slant,()=>poly([[0,0],[W,0],[W,sy-slant],[0,sy+slant]]),{filter:'contrast(1.05) saturate(1.05)'});
    ctx.fillStyle=P.accent; poly([[0,sy+slant],[W,sy-slant],[W,sy-slant+H*0.011],[0,sy+slant+H*0.011]]); ctx.fill();
    ax=pad; aw=W-2*pad; ay=sy+slant+H*0.035; ah=H-ay-H*0.1;
    drawPill(tag,pad,sy-slant-H*0.015,Math.round(W*0.06),'left',P.accent,P.tagFg,'','800 '+Math.round(W*0.032)+'px '+ANEK);
    drawBrand(W-pad,pad*0.7,Math.round(W*0.052),'right');
  }
  drawHeadBody(head,body,ax,ay,aw,ah,{headCol:P.base,headHi:P.hi,bodyCol:P.bodyCol,bodyHi:P.bodyHi,bodyMax:Math.round(u*0.034),gap:H*0.014});
  const dh=Math.round(u*0.04), fy=H-Math.round(H*0.045);
  if(vertical){
    followRow(W-pad*0.8,fy-dh-Math.round(u*0.024),Math.round(u*0.034),P.accent,P.bodyCol,(W-ax-pad*0.8));
    drawDate(ax,fy-dh/2,dh,'left','rgba(0,0,0,.4)','#fff',P.accent);
  } else {
    drawDate(ax,fy-dh/2,dh,'left','rgba(0,0,0,.4)','#fff',P.accent);
    followRow(W-pad,fy,Math.round(u*0.034),P.accent,P.bodyCol,W*0.62);
  }
 }};

/* सिर्फ़ टेक्स्ट - चाहें तो छोटी गोल फ़ोटो भी (फ़ोटो न हो तो वह जगह अपने-आप हट जाती है) */
TPL.text = { name:'सिर्फ़ टेक्स्ट (फ़ोटो चाहें तो गोल)', body:true, color:true, bodyLabel:'पूरी खबर (यहाँ लंबा टेक्स्ट भी चलेगा):',
 draw(g,head,body,tag){
  const P=pal(), {W,H,wide}=g, pad=Math.round(W*0.06), unit=Math.min(W,H*1.3);
  const bg=ctx.createLinearGradient(0,0,W*0.6,H); bg.addColorStop(0,P.bg0); bg.addColorStop(1,P.bg1); ctx.fillStyle=bg; ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.globalAlpha=0.06; ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(W*0.92,H*0.1,Math.min(W,H)*0.45,0,7); ctx.fill(); ctx.beginPath(); ctx.arc(W*0.04,H*0.96,Math.min(W,H)*0.36,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.globalAlpha=0.05; ctx.strokeStyle='#fff'; ctx.lineWidth=3; for(let i=-H;i<W;i+=40){ ctx.beginPath(); ctx.moveTo(i,H); ctx.lineTo(i+H,0); ctx.stroke(); } ctx.restore();
  ctx.fillStyle=P.accent; ctx.fillRect(0,0,Math.round(W*0.014),H);
  const fh=Math.round(W*0.062), tagH=Math.round(unit*0.062);
  drawPill(tag,pad,pad*0.7,tagH,'left',P.accent,P.tagFg,'','800 '+Math.round(tagH*0.5)+'px '+ANEK);
  drawBrand(W-pad,pad*0.7,Math.round(unit*0.055),'right');
  let ax=pad, aw=W-2*pad, ay=pad*0.7+tagH+H*0.04, ah=H-fh-ay-H*0.03, align='left';
  if(photo){
    const ring=Math.max(6,W*0.008);
    let D,cx,cy;
    if(wide){ D=H*0.56; cx=W-pad-D/2-ring; cy=(H-fh)/2+tagH*0.3; aw=cx-D/2-ring-pad*1.3-pad; ay=pad*0.7+tagH+H*0.04; ah=H-fh-ay-H*0.03; }
    else { D=W*(g.story?0.44:g.sq?0.28:0.36); cx=W/2; cy=ay+D/2+ring; ay=cy+D/2+ring+H*0.03; ah=H-fh-ay-H*0.03; align='center'; }
    ctx.save(); ctx.shadowColor='rgba(0,0,0,.5)'; ctx.shadowBlur=26; ctx.shadowOffsetY=8; ctx.fillStyle=P.accent; ctx.beginPath(); ctx.arc(cx,cy,D/2+ring,0,7); ctx.fill(); ctx.restore();
    paintPhoto(cx-D/2,cy-D/2,D,D,()=>{ ctx.beginPath(); ctx.arc(cx,cy,D/2,0,7); },{filter:'contrast(1.05) saturate(1.06)'});
  }
  drawHeadBody(head,body,ax,ay,aw,ah,{align:align,headCol:P.base,headHi:P.hi,bodyCol:P.bodyCol,bodyHi:P.bodyHi,bodyMax:Math.round(unit*(g.story?0.068:0.052)),gap:H*0.05,divider:P.accent,divW:Math.round(W*0.16),divH:Math.max(6,Math.round(H*0.006)),bodyLH:1.4,headFx:{shadow:'rgba(0,0,0,.45)',shadowBlur:8,shadowY:3}});
  ctx.fillStyle='rgba(0,0,0,.35)'; ctx.fillRect(0,H-fh,W,fh); ctx.fillStyle=P.accent; ctx.fillRect(0,H-fh,W,Math.max(4,fh*0.08));
  footerRow(pad,W-pad,H-fh/2+2,fh,'#fff','#fff',P.bodyCol);
 }};

/* वीडियो 9:16 कवर/ओवरले - सिर्फ़ नीचे छोटा कार्ड, ऊपर बस दो छोटे चिप. बाकी पूरा वीडियो खुला रहता है.
   (ऐप के बटनों वाला सबसे निचला हिस्सा खाली रहता है) */
TPL.video9 = { name:'वीडियो 9:16 • हल्का ओवरले', fmts:['story'], noPhoto:true, color:true, ovh:true, body:false,
 draw(g,head,body,tag){
  const P=pal(), {W,H}=g, pad=Math.round(W*0.05), r=Math.round(W*0.04);
  const chipH=Math.round(W*0.055), chipY=H*0.075;
  drawPill(tag,pad,chipY,chipH,'left',P.accent,P.tagFg,'','800 '+Math.round(chipH*0.5)+'px '+ANEK);
  drawBrand(W-pad,chipY,chipH,'right');
  const cardH=H*parseFloat(el('ovH').value)/100, barH=Math.round(H*0.052), bottom=H*0.79;
  const barY=bottom-barH, cardY=barY-cardH-H*0.008;
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.45)'; ctx.shadowBlur=24; ctx.shadowOffsetY=8;
  rrect(pad,cardY,W-2*pad,cardH,r); ctx.fillStyle=vgrad(cardY,cardY+cardH,[[0,P.bg0],[1,P.bg1]]); ctx.fill(); ctx.restore();
  rrect(pad,cardY,W-2*pad,cardH,r); ctx.lineWidth=Math.max(4,W*0.006); ctx.strokeStyle=P.accent; ctx.stroke();
  const ax=pad*1.8, aw=W-2*pad*1.8, ay=cardY+cardH*0.07, ah=cardH*0.86;
  drawHeadBody(head,[],ax,ay,aw,ah,{align:'center',headCol:P.base,headHi:P.hi,headMax:H*0.09,headFx:{shadow:'rgba(0,0,0,.4)',shadowBlur:8,shadowY:3}});
  ctx.save(); ctx.shadowColor='rgba(0,0,0,.4)'; ctx.shadowBlur=18; ctx.shadowOffsetY=6;
  rrect(pad,barY,W-2*pad,barH,r*0.7); ctx.fillStyle=P.bg1; ctx.fill(); ctx.restore();
  rrect(pad,barY,W-2*pad,barH,r*0.7); ctx.lineWidth=Math.max(3,W*0.004); ctx.strokeStyle=P.accent; ctx.stroke();
  footerRow(pad*1.8,W-pad*1.8,barY+barH/2+2,barH*0.62,'#fff','#fff',P.bodyCol);
 }};


// टैग खाली हो तो खबर देखकर अपने-आप सही लेबल (हर खबर "ताज़ा" नहीं होती)
function autoTag(headTxt,bodyTxt){
  const t=((headTxt||'')+' '+(bodyTxt||'')).replace(/\*/g,' ');
  const has=arr=>arr.some(w=>t.indexOf(w)>-1);
  if(has(['चोरी','गोली','हत्या','लूट','गिरफ्तार','फायर','तस्करी','ठगी','धोखाधड़ी','अपराध'])) return 'क्राइम न्यूज़';
  if(has(['हादसा','टक्कर','दुर्घटना','करंट','आग लग','हादसे'])) return 'हादसा';
  if(has(['कुश्ती','पदक','मेडल','खिलाड़ी','स्विमिंग','क्रिकेट','चैंपियनशिप','प्रतियोगिता'])) return 'खेल समाचार';
  if(has(['रेल','ट्रेन','रेलवे'])) return 'रेल समाचार';
  if(has(['किसान','अधिग्रहण'])) return 'किसान';
  if(has(['कॉलेज','स्कूल','विद्यार्थी','छात्र','शिक्षक'])) return 'शिक्षा';
  if(has(['सीएम','पीएम','मुख्यमंत्री','प्रधानमंत्री','मंत्री','विधायक','सांसद','योगी','मोदी'])) return 'राजनीति';
  if(has(['पुलिस','आयुक्त','थाना','थाने'])) return 'पुलिस न्यूज़';
  for(const p of KNOWN_PLACES){ const q=p.replace('-',' '); if(['भारत','गंगा','वरुणा','विश्वनाथ','कैंट','क्राइस्ट'].indexOf(q)>-1) continue; if(t.indexOf(q)>-1) return q+' न्यूज़'; }
  return 'खबर';
}

/* ---------------- मुख्य रेंडर ---------------- */
let rafId=0;
function render(){ cancelAnimationFrame(rafId); rafId=requestAnimationFrame(doRender); }
function doRender(){
  const t=TPL[S.tpl]; let f=FMTS[S.fmt];
  if(t.fmts && !t.fmts.includes(S.fmt)){ S.fmt=t.fmts[0]; f=FMTS[S.fmt]; buildButtons(); }
  if(cv.width!==f.W||cv.height!==f.H){ cv.width=f.W; cv.height=f.H; }
  setToday(false);
  const g={W:f.W,H:f.H,wide:f.W>f.H,story:f.H/f.W>1.6,sq:f.W===f.H};
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,f.W,f.H); ctx.globalAlpha=1; ctx.globalCompositeOperation='source-over'; ctx.filter='none';
  const head=colorWords(el('headInp').value,2,7919);
  const body=t.body? colorWords(el('bodyInp').value,3,104729) : [];
  const tag=(el('tagInp').value.trim())||autoTag(el('headInp').value,el('bodyInp').value);
  t.draw(g,head,body,tag);
  // लेबल और कंट्रोल बदलना
  el('bodyLbl').textContent=t.bodyLabel||'नीचे की खबर:';
  el('bodyInp').disabled=!t.body; el('bodyInp').style.opacity=t.body?1:0.4;
  el('tagLbl').textContent='टैग / लेबल (खाली छोड़ें तो खबर से अपने-आप बनेगा):';
  el('tagInp').placeholder=t.tag===null?'(इस डिज़ाइन में नहीं आता)':'खाली छोड़ें तो खबर देखकर अपने-आप (जैसे: क्राइम न्यूज़, खेल समाचार, वाराणसी न्यूज़)';
  el('tagInp').disabled=t.tag===null; el('tagInp').style.opacity=t.tag===null?0.4:1;
  el('colorCtl').classList.toggle('hide',!t.color);
  el('ovCtl').classList.toggle('hide',!t.ovh);
  el('styleBox').classList.toggle('hide',!(t.color||t.ovh));
  const nop=!!t.noPhoto;
  el('imageLoader').disabled=nop; el('imageLoader').style.opacity=nop?0.4:1;
  el('photoHint').textContent = nop ? 'इस फ्रेम में फ़ोटो नहीं आती। यह वीडियो के ऊपर कवर / लेआउट / PIP की तरह लगाने के लिए है।'
     : (S.tpl==='text' ? 'फ़ोटो डालेंगे तो छोटी गोल फ़ोटो बनेगी; न डालें तो वह जगह अपने-आप हट जाएगी।' : 'फ़ोटो न डालें तो फ़ोटो वाला हिस्सा पारदर्शी रहेगा (ओवरले / जैकेट PNG)। टैग, लोगो और टेक्स्ट बने रहेंगे।');
  fitPreview();
}
function fitPreview(){
  const wide=cv.width>cv.height;
  const target = window.innerWidth<=860 ? Math.min(window.innerWidth-28, wide?700:520) : (wide?720:520);
  cv.style.width=target+'px';
}

/* ---------------- बटन, फ़ोटो, लोगो, तारीख ---------------- */
function buildButtons(){
  const tg=el('tplGrid'); tg.innerHTML='';
  Object.keys(TPL).forEach(k=>{ const b=document.createElement('button'); b.className='opt'+(S.tpl===k?' on':''); b.textContent=TPL[k].name; b.onclick=()=>{ S.tpl=k; buildButtons(); render(); }; tg.appendChild(b); });
  const fg=el('fmtGrid'); fg.innerHTML='';
  Object.keys(FMTS).forEach(k=>{ const b=document.createElement('button'); b.className='opt'+(S.fmt===k?' on':''); b.textContent=FMTS[k].name;
    const t=TPL[S.tpl]; if(t.fmts && !t.fmts.includes(k)){ b.style.opacity=.35; }
    b.onclick=()=>{ const t=TPL[S.tpl]; if(t.fmts && !t.fmts.includes(k)){ alert('"'+t.name+'" सिर्फ़ '+FMTS[t.fmts[0]].name+' में बनता है।'); return; } S.fmt=k; buildButtons(); render(); }; fg.appendChild(b); });
}
function buildColors(){
  const sel=el('colorSel'); sel.innerHTML='';
  Object.keys(PAL).forEach(k=>{ const o=document.createElement('option'); o.value=k; o.textContent=PAL[k].name; if(S.color===k) o.selected=true; sel.appendChild(o); });
}
function setToday(force){
  const d=el('dateInp'); if(d.value && !force) return;
  const t=new Date(), p=n=>String(n).padStart(2,'0'); d.value=t.getFullYear()+'-'+p(t.getMonth()+1)+'-'+p(t.getDate());
}
function loadPhoto(){
  const f=el('imageLoader').files[0]; if(!f) return;
  const img=new Image();
  img.onload=()=>{ photo=img; el('zoom').value=1; el('offX').value=0; el('offY').value=0; render(); };
  img.onerror=()=>alert('यह फ़ोटो खुल नहीं पाई, कोई और फ़ोटो चुनें।');
  img.src=URL.createObjectURL(f);
}
function loadLogo(){
  const f=el('logoLoader').files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=e=>{ const img=new Image(); img.onload=()=>{ logo=img; try{ localStorage.setItem('pn_logo',e.target.result); }catch(x){} render(); }; img.src=e.target.result; };
  rd.readAsDataURL(f);
}
function clearLogo(){ logo=null; try{ localStorage.removeItem('pn_logo'); }catch(x){} render(); }
function removePhoto(){ photo=null; el('imageLoader').value=''; render(); }
function reshuffle(){ S.seed+=1; render(); }

async function download(){
  const btn=el('saveBtn'), old=btn.textContent; btn.tकextContent='सेव हो रहा है...';
  try{
    await document.fonts.ready; doRender();
    const blob=await new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('blob')),'image/png'));
    const t=new Date(), p=n=>String(n).padStart(2,'0');
    const name='PravinNews_'+S.tpl+'_'+S.fmt+'_'+t.getFullYear()+p(t.getMonth()+1)+p(t.getDate())+'_'+p(t.getHours())+p(t.getMinutes())+'.png';
    const url=URL.createObjectURL(blob), a=document.createElement('a'); a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),5000);
    setToday(true);                         // डाउनलोड के बाद तारीख अपने आप आज की हो जाए
  }catch(err){
    console.error(err);
    alert('पोस्टर सेव नहीं हो पाया। (क्लासिक डिज़ाइन में frame.png/इंटरनेट जाँचिए) फिर कोशिश कीजिए।');
  }finally{ btn.textContent=old; render(); }
}

/* ---------------- शुरुआत ---------------- */
frame=new Image(); frame.crossOrigin='anonymous';
frame.onerror=function(){ frame.onerror=null; frame.src='https://i.postimg.cc/GmkN6q4B/New-Project-(2).png'; };
frame.onload=()=>render(); frame.src='frame.png';
try{ const saved=localStorage.getItem('pn_logo'); if(saved){ const im=new Image(); im.onload=()=>{ logo=im; render(); }; im.src=saved; } }catch(x){}

window.onload=function(){
  setToday(false); buildButtons(); buildColors(); render();
  if(document.fonts && document.fonts.load){
    Promise.all([
      document.fonts.load('700 60px Khand','अआकAB'), document.fonts.load('600 60px Khand','अआकAB'),
      document.fonts.load('700 40px "Anek Devanagari"','अआकAB'), document.fonts.load('800 40px "Anek Devanagari"','अआकAB')
    ]).catch(()=>{}).then(()=>render());
  }
};
window.onresize=fitPreview;
</script>
